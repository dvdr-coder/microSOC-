name: MicroSoC CI Simulation

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-simulate:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          gcc-riscv64-unknown-elf \
          picojson-dev \
          git \
          help2man \
          perl \
          python3 \
          make \
          g++ \
          libfl-dev \
          zlib1g-dev

    - name: Cache Verilator Build
      id: cache-verilator
      uses: actions/cache@v4
      with:
        path: ~/verilator_inst
        key: verilator-v5.022-ubuntu-latest

    - name: Install Verilator 5.x
      if: steps.cache-verilator.outputs.cache-hit != 'true'
      run: |
        git clone https://github.com/verilator/verilator
        cd verilator
        git checkout v5.022
        autoconf
        ./configure --prefix=$HOME/verilator_inst
        make -j$(nproc)
        make install

    - name: Set Environment Variables
      run: |
        echo "$HOME/verilator_inst/bin" >> $GITHUB_PATH

    - name: Build Firmware and Run Verilator Simulation
      run: |
        verilator --version
        make clean
        make
